# Local-only credentials. Do not expose this stack publicly.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: operator
      POSTGRES_PASSWORD: operator_local
      POSTGRES_DB: operator
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U operator"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
  temporal:
    image: temporalio/temporal:1.9.1
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/var/lib/temporal/temporal.db"]
    ports: ["127.0.0.1:7233:7233", "127.0.0.1:8233:8233"]
    volumes: ["temporal-data:/var/lib/temporal"]
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: operator_local
      MINIO_ROOT_PASSWORD: operator_local_storage
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio-data:/data"]
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://operator:operator_local@postgres:5432/operator
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
  workflow-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["python", "-m", "operator_worker.main"]
    environment:
      DATABASE_URL: postgresql+psycopg://operator:operator_local@postgres:5432/operator
      TEMPORAL_ADDRESS: temporal:7233
    restart: on-failure
    depends_on:
      api:
        condition: service_healthy
      temporal:
        condition: service_started
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
volumes:
  postgres-data:
  temporal-data:
  minio-data:
