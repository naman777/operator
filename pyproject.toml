[project]
name = "operator-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.141.1,<0.142", "uvicorn>=0.31.1,<1", "pydantic>=2.13,<3", "sqlalchemy>=2.0.36,<2.1", "psycopg[binary]>=3.2,<4", "pgvector>=0.3,<1", "temporalio==1.33.0", "pypdf>=6.19,<7", "starlette>=1.6,<1.7", "python-docx>=1,<2", "python-multipart>=0.0.9,<0.1", "httpx>=0.27,<0.29", "mcp==2.2.0", "sse-starlette>=3,<3.1", "playwright>=1.54,<2", "openai-agents>=0.2,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
operator-mcp = "operator_mcp.server:main"

[tool.pytest.ini_options]
pythonpath = ["apps/api", "services/workflow-worker"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.packages.find]
where = ["apps/api", "services/workflow-worker", "services/mcp-server"]
