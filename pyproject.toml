[project]
name = "operator-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115.5,<0.116", "uvicorn>=0.30,<0.31", "pydantic>=2.13,<3", "sqlalchemy>=2.0.36,<2.1", "psycopg[binary]>=3.2,<4", "temporalio==1.33.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<0.29", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["apps/api", "services/workflow-worker"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.packages.find]
where = ["apps/api", "services/workflow-worker"]
