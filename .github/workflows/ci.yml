name: Quality and deploy
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pip install '.[dev]'
      - run: python -m ruff check apps/api services scripts tests infra/migrations
      - run: python -m pytest -q
      - run: python -m pytest tests/workflow/test_temporal.py -q
        env:
          OPERATOR_RUN_TEMPORAL_TESTS: "1"
      - run: pnpm install --frozen-lockfile
      - run: pnpm contracts
      - run: git diff --exit-code -- packages/contracts
      - run: pnpm format:check
      - run: pnpm test:web
      - run: pnpm typecheck
      - run: pnpm build
      - run: docker compose --env-file .env.production.example -f compose.production.yaml config --quiet
      - run: docker compose --env-file .env.single-host.example -f compose.single-host.yaml config --quiet
      - run: docker compose --env-file .env.gcp-production.example -f compose.gcp-production.yaml config --quiet

  publish:
    name: Publish ${{ matrix.image }} image
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: api
            dockerfile: apps/api/Dockerfile
          - image: web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: registry
        name: Normalize registry path
        shell: bash
        run: echo "base=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.registry.outputs.base }}/${{ matrix.image }}:${{ github.sha }}
            ${{ steps.registry.outputs.base }}/${{ matrix.image }}:production
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy-production:
    name: Deploy production
    if: >-
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')) &&
      vars.PRODUCTION_ENABLED == 'true'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v4
      - id: registry
        name: Resolve immutable image names
        shell: bash
        run: |
          echo "api=ghcr.io/${GITHUB_REPOSITORY,,}/api:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${GITHUB_REPOSITORY,,}/web:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Install deployment manifests
        shell: bash
        env:
          DEPLOY_TARGET: ${{ vars.PRODUCTION_USER }}@${{ vars.PRODUCTION_HOST }}
          DEPLOY_PATH: ${{ vars.PRODUCTION_PATH }}
        run: |
          ssh "$DEPLOY_TARGET" "mkdir -p '$DEPLOY_PATH/infra/temporal/dynamicconfig' '$DEPLOY_PATH/scripts' '$DEPLOY_PATH/backups'"
          scp compose.gcp-production.yaml "$DEPLOY_TARGET:$DEPLOY_PATH/compose.gcp-production.yaml"
          scp infra/Caddyfile "$DEPLOY_TARGET:$DEPLOY_PATH/infra/Caddyfile"
          scp infra/temporal/setup-postgres.sh "$DEPLOY_TARGET:$DEPLOY_PATH/infra/temporal/setup-postgres.sh"
          scp infra/temporal/create-namespace.sh "$DEPLOY_TARGET:$DEPLOY_PATH/infra/temporal/create-namespace.sh"
          scp infra/temporal/dynamicconfig/production-sql.yaml "$DEPLOY_TARGET:$DEPLOY_PATH/infra/temporal/dynamicconfig/production-sql.yaml"
          scp scripts/deploy-gcp.sh "$DEPLOY_TARGET:$DEPLOY_PATH/scripts/deploy-gcp.sh"
      - name: Authenticate VM to GHCR
        shell: bash
        env:
          DEPLOY_TARGET: ${{ vars.PRODUCTION_USER }}@${{ vars.PRODUCTION_HOST }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh "$DEPLOY_TARGET" "docker login ghcr.io --username '$GHCR_USER' --password-stdin"
      - name: Validate, migrate, and deploy
        shell: bash
        env:
          API_IMAGE: ${{ steps.registry.outputs.api }}
          WEB_IMAGE: ${{ steps.registry.outputs.web }}
          DEPLOY_TARGET: ${{ vars.PRODUCTION_USER }}@${{ vars.PRODUCTION_HOST }}
          DEPLOY_PATH: ${{ vars.PRODUCTION_PATH }}
          PUBLIC_ENABLED: ${{ vars.PRODUCTION_PUBLIC_ENABLED }}
        run: |
          deploy_args=
          if [ "$PUBLIC_ENABLED" = "true" ]; then
            deploy_args=--expose
          fi
          ssh "$DEPLOY_TARGET" "cd '$DEPLOY_PATH' && OPERATOR_API_IMAGE='$API_IMAGE' OPERATOR_WEB_IMAGE='$WEB_IMAGE' OPERATOR_DEPLOY_PATH='$DEPLOY_PATH' sh scripts/deploy-gcp.sh $deploy_args"
      - name: Remove temporary registry credential
        if: always()
        shell: bash
        env:
          DEPLOY_TARGET: ${{ vars.PRODUCTION_USER }}@${{ vars.PRODUCTION_HOST }}
        run: ssh "$DEPLOY_TARGET" "docker logout ghcr.io >/dev/null 2>&1 || true"
      - name: Verify public HTTPS
        if: vars.PRODUCTION_PUBLIC_ENABLED == 'true'
        shell: bash
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          for attempt in {1..24}; do
            if curl --fail --silent --show-error --max-time 10 "$PRODUCTION_URL/api/health/ready" > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "Production did not become healthy within two minutes" >&2
          exit 1
